<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e10">
  <title>江湖 · 侠客修行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body data-identity="youxia" data-time="清晨" data-weather="mist">

  <!-- ===== 统一氛围舞台（无大图；远近分层 / 雾 / 粒子 / 颗粒） ===== -->
  <div id="bgStage" aria-hidden="true">
    <div id="bgFar" class="bg-layer" data-depth="0.018"></div>
    <div id="bgMid" class="bg-layer" data-depth="0.030"></div>
    <div id="bgCloud" class="bg-layer" data-depth="0.055"></div>
    <div id="bgGrade" class="bg-layer"></div>
    <div id="bgVignette" class="bg-layer"></div>
    <div id="bgMist" class="bg-layer" data-depth="0.075"></div>
    <div id="bgGrain" class="bg-layer"></div>
    <div id="particleLayer"></div>
  </div>

  <!-- 身份选择时的抽象光晕 / 反馈层（随身份切换语言） -->
  <div id="identityAura" aria-hidden="true"></div>

  <!-- 个人页沉浸式身份图背景（仅「侠客 / 个人」视图显示） -->
  <div id="personaBg" aria-hidden="true"></div>

  <!-- 入江湖仪式感遮罩 -->
  <div id="ritualOverlay" aria-hidden="true">
    <div class="ritual-inner">
      <div class="ritual-name" id="ritualName"></div>
      <div class="ritual-motto" id="ritualMotto"></div>
      <div class="ritual-ring"></div>
    </div>
  </div>

  <div id="app">

    <!-- ========== 入江湖（身份选择 + 取侠客名） ========== -->
    <div class="view active" id="view-auth">
      <div class="enter-wrap">
        <header class="enter-head">
          <div class="enter-kicker">东方武侠 · 文字修行</div>
          <h1 class="enter-title">入 江 湖</h1>
          <p class="enter-sub">择一种人生，取一侠客名，入此江湖。</p>
        </header>

        <div class="enter-grid">
          <div class="identity-tokens" id="identityList"><!-- JS 注入七身份抽象符号 --></div>

          <aside class="identity-detail" id="identityDetail">
            <div class="id-detail-mark" id="idDetailMark"></div>
            <div class="id-detail-name" id="idDetailName">江湖游侠</div>
            <div class="id-detail-motto" id="idDetailMotto">四海为家，自由无拘</div>
            <div class="id-detail-meta" id="idDetailMeta"></div>
            <div class="id-detail-desc" id="idDetailDesc"></div>
            <div class="id-detail-hint">轻触左侧身份，感受另一种人生 · 选定后取一名即可入江湖</div>
          </aside>
        </div>

        <div class="enter-name">
          <input type="text" class="auth-input" id="authUsername" placeholder="取一侠客名" maxlength="12" autocomplete="off">
          <button class="btn-enter" onclick="app.submitRegister()">入 江 湖</button>
        </div>
      </div>
    </div>

    <!-- ========== 江湖首页（今日修行入口） ========== -->
    <div class="view" id="view-home">
      <div class="home-hero">
        <div class="home-time" id="homeTime"></div>
        <div class="home-identity-name" id="homeIdentityName"></div>
        <div class="home-char" id="homeChar"></div>
        <p class="home-greeting" id="homeGreeting"></p>
        <button class="home-cultivate" id="homeActionBtn" onclick="app.startCultivation()">今 日 修 行</button>
        <div class="home-mini-stats" id="homeMiniStats"></div>
      </div>

      <div class="home-switch">
        <div class="switch-title">— 七种人生，皆可历 —</div>
        <div class="identity-switcher" id="identitySwitcher"></div>
      </div>
    </div>

    <!-- ========== 我的侠客 ========== -->
    <div class="view" id="view-knight">
      <div class="panel">
        <div class="knight-header">
          <h2 class="view-title">我的侠客</h2>
          <p id="knightPageSubtitle"></p>
        </div>
        <div class="stats-panel">
          <div class="stats-panel-title">属性成长</div>
          <div id="knightStatsPanel"></div>
        </div>
        <div class="stats-panel" style="margin-top:1.4rem;">
          <div class="stats-panel-title">身份体验</div>
          <div id="identityProgress"></div>
        </div>
        <div class="history-panel">
          <div class="stats-panel-title">江湖经历</div>
          <div id="knightHistory"></div>
        </div>
      </div>
    </div>

    <!-- ========== 今日修行 ========== -->
    <div class="view" id="view-cultivation">
      <div class="cult-header">
        <div class="cult-date" id="cultivationDate"></div>
        <h2 class="cult-title">今 日 修 行</h2>
        <div class="cult-identity" id="cultIdentity"></div>
      </div>
      <div class="carrier" id="cultivationContent"><!-- JS 注入当日手札 --></div>
    </div>

    <!-- ========== 个人界面 ========== -->
    <div class="view" id="view-profile">
      <div class="panel">
        <div class="profile-header">
          <h2 class="view-title" id="profileName"></h2>
          <p id="profileSub"></p>
        </div>

        <div class="stats-panel">
          <div class="stats-panel-title">自创人设</div>
          <div id="profilePersona"></div>
        </div>

        <div class="stats-panel" style="margin-top:1.4rem;">
          <div id="profileIdentity"></div>
        </div>

        <div class="stats-panel" style="margin-top:1.4rem;">
          <div class="stats-panel-title">藏书阁</div>
          <div class="library-tabs">
            <button class="library-tab library-tab-profile active" data-tab="all" onclick="app.switchLibraryTab('all','profileLibraryGrid')">全部</button>
            <button class="library-tab library-tab-profile" data-tab="poetry" onclick="app.switchLibraryTab('poetry','profileLibraryGrid')">诗词</button>
            <button class="library-tab library-tab-profile" data-tab="wisdom" onclick="app.switchLibraryTab('wisdom','profileLibraryGrid')">典籍</button>
            <button class="library-tab library-tab-profile" data-tab="martial" onclick="app.switchLibraryTab('martial','profileLibraryGrid')">武学</button>
          </div>
          <div class="library-grid" id="profileLibraryGrid"></div>
        </div>
      </div>
    </div>

    <!-- ========== 藏书阁（独立视图） ========== -->
    <div class="view" id="view-library">
      <div class="panel">
        <div class="library-header">
          <h2 class="view-title">藏书阁</h2>
          <p>收藏所学典籍、诗词与武学笔记</p>
        </div>
        <div class="library-tabs">
          <button class="library-tab active" data-tab="all" onclick="app.switchLibraryTab('all')">全部</button>
          <button class="library-tab" data-tab="poetry" onclick="app.switchLibraryTab('poetry')">诗词</button>
          <button class="library-tab" data-tab="wisdom" onclick="app.switchLibraryTab('wisdom')">典籍</button>
          <button class="library-tab" data-tab="martial" onclick="app.switchLibraryTab('martial')">武学</button>
        </div>
        <div class="library-grid" id="libraryGrid"></div>
      </div>
    </div>

  </div>

  <!-- 底部导航 -->
  <nav class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item active" data-view="home" onclick="app.switchView('home')">
      <span class="nav-icon">山</span><span class="nav-label">江湖</span>
    </div>
    <div class="nav-item" data-view="knight" onclick="app.switchView('knight')">
      <span class="nav-icon">侠</span><span class="nav-label">侠客</span>
    </div>
    <div class="nav-item" data-view="cultivation" onclick="app.switchView('cultivation')">
      <span class="nav-icon">修</span><span class="nav-label">修行</span>
    </div>
    <div class="nav-item" data-view="profile" onclick="app.switchView('profile')">
      <span class="nav-icon">印</span><span class="nav-label">个人</span>
    </div>
    <div class="nav-item nav-sound" id="navSound" onclick="app.toggleSound()" title="环境音">
      <span class="nav-icon" id="soundIcon">音</span><span class="nav-label">音</span>
    </div>
  </nav>

  <!-- 人设编辑弹窗（仅文字，无画像上传） -->
  <div class="modal-mask" id="personaModal" style="display:none;">
    <div class="modal-box">
      <h3 class="modal-title">自创人设</h3>
      <input type="text" class="auth-input" id="personaName" placeholder="人设之名" maxlength="12">
      <textarea class="auth-textarea" id="personaDesc" placeholder="述其人设：来历、性情人等" maxlength="200"></textarea>
      <div id="personaPreview"></div>
      <div style="margin-top:1rem; text-align:center; gap:.6rem; display:flex; justify-content:center;">
        <button class="btn-primary" onclick="app.savePersona()">存</button>
        <button class="btn-secondary" onclick="app.closePersonaModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- 载入淡入遮罩 -->
  <div id="enterVeil"></div>

  <!-- 点击反馈层 -->
  <div id="rippleLayer" aria-hidden="true"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/images.js?v=5"></script>
  <script src="js/data.js?v=5"></script>
  <script src="js/data-relations.js?v=5"></script>
  <script src="js/data-identity-cultivation.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
